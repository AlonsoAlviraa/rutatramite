name: Setup Node project
description: Detect the package manager from the lockfile, install the Node version from .nvmrc or engines, and cache dependencies.

outputs:
  pm:
    description: Package manager selected from the lockfile
    value: ${{ steps.meta.outputs.pm }}
  node-version:
    description: Node.js version spec
    value: ${{ steps.meta.outputs.node-version }}

runs:
  using: composite
  steps:
    - name: Detect package manager and Node version
      id: meta
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! -f package.json ]]; then
          echo "pm=" >> "$GITHUB_OUTPUT"
          echo "node-version=22" >> "$GITHUB_OUTPUT"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        pm="$(bash .github/scripts/pm.sh detect)"
        node_ver="$(bash .github/scripts/pm.sh node-version)"
        {
          echo "pm=${pm}"
          echo "node-version=${node_ver}"
          echo "skip=false"
        } >> "$GITHUB_OUTPUT"

    - name: Setup Node.js
      if: steps.meta.outputs.skip != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.meta.outputs.node-version }}

    - name: Setup Bun
      if: steps.meta.outputs.pm == 'bun'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    - name: Activate package manager
      if: steps.meta.outputs.pm == 'pnpm' || steps.meta.outputs.pm == 'yarn'
      shell: bash
      run: bash .github/scripts/pm.sh activate

    - name: Resolve dependency cache directory
      id: cache-dir
      if: steps.meta.outputs.skip != 'true'
      shell: bash
      run: |
        set -euo pipefail
        dir="$(bash .github/scripts/pm.sh cache-dir)"
        echo "path=${dir}" >> "$GITHUB_OUTPUT"

    - name: Cache package manager store
      if: steps.meta.outputs.skip != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache-dir.outputs.path }}
        key: ${{ runner.os }}-${{ steps.meta.outputs.pm }}-${{ hashFiles('package-lock.json', 'pnpm-lock.yaml', 'yarn.lock', 'bun.lock', 'bun.lockb', 'package.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ steps.meta.outputs.pm }}-

    - name: Install dependencies
      if: steps.meta.outputs.skip != 'true'
      shell: bash
      run: bash .github/scripts/pm.sh install
